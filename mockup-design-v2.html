<!DOCTYPE html>
<html lang="fr">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maquette — Réimpression Bon Carrefour Vannes</title>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <style id="pageStyle">@page { size: A4 portrait; margin: 10mm; }</style>
  <style>
    /* =========================================================
       MAQUETTE — proposition de design modernisé
       (poste fixe • aperçu agrandi volontaire • sans persistance)
       ========================================================= */
    :root {
      --cf-blue: #004E9F;
      --cf-blue-dark: #003a78;
      --cf-blue-50: #eef4fc;
      --cf-red: #E2001A;
      --ink: #14181f;
      --muted: #667085;
      --line: #c7ccd4;
      --paper: #ffffff;

      /* Tokens UI modernisés */
      --bg-app: #f3f5f9;
      --bg-panel: #ffffff;
      --bg-rail: #0e2034;          /* sidebar foncée, plus haut de gamme */
      --rail-ink: #e8eef6;
      --rail-muted: #9fb1c7;
      --rail-line: rgba(255,255,255,.10);
      --radius: 14px;
      --radius-sm: 10px;
      --shadow-sm: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.10);
      --shadow-md: 0 8px 24px rgba(16,24,40,.12);
      --shadow-lg: 0 20px 50px rgba(8,20,45,.22);
      --focus: 0 0 0 3px rgba(0,78,159,.22);
      --rail-w: 320px;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: "Inter", "Segoe UI", Roboto, -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--ink);
      background: var(--bg-app);
      -webkit-font-smoothing: antialiased;
    }

    /* ===================== SIDEBAR (rail) ===================== */
    .rail {
      position: fixed;
      top: 0; right: 0;
      width: var(--rail-w);
      height: 100vh;
      background: radial-gradient(120% 80% at 100% 0%, #16314f 0%, var(--bg-rail) 55%);
      color: var(--rail-ink);
      display: flex;
      flex-direction: column;
      z-index: 20;
      border-left: 1px solid var(--rail-line);
    }

    .rail__brand {
      display: flex; align-items: center; gap: 12px;
      padding: 22px 24px;
      border-bottom: 1px solid var(--rail-line);
    }
    .rail__logo {
      width: 42px; height: 42px; flex: none;
      background: #fff; border-radius: 11px;
      display: grid; place-items: center;
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }
    .rail__logo img { width: 34px; height: auto; display: block; }
    .rail__brand h1 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: -.2px; }
    .rail__brand p  { margin: 2px 0 0; font-size: 12px; color: var(--rail-muted); }

    .rail__body { flex: 1; overflow-y: auto; padding: 22px 24px; }
    .group { margin-bottom: 26px; }
    .group__label {
      font-size: 11px; font-weight: 700; letter-spacing: .8px;
      text-transform: uppercase; color: var(--rail-muted);
      margin: 0 0 12px;
    }

    /* ---- Toggle format avec icônes d'orientation ---- */
    .format-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .format-card {
      appearance: none; border: 1.5px solid var(--rail-line);
      background: rgba(255,255,255,.04); color: var(--rail-ink);
      border-radius: var(--radius-sm); padding: 14px 10px;
      cursor: pointer; text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      transition: border-color .15s, background .15s, transform .05s;
    }
    .format-card:hover { background: rgba(255,255,255,.08); }
    .format-card:active { transform: translateY(1px); }
    .format-card .glyph {
      border: 2px solid currentColor; border-radius: 4px; opacity: .85;
    }
    .format-card[data-fmt="vertical"]   .glyph { width: 22px; height: 34px; }
    .format-card[data-fmt="horizontal"] .glyph { width: 36px; height: 18px; }
    .format-card .name { font-size: 13px; font-weight: 700; }
    .format-card .dim  { font-size: 11px; color: var(--rail-muted); }
    .format-card.active {
      border-color: #2f8bff;
      background: rgba(47,139,255,.16);
      box-shadow: 0 0 0 1px rgba(47,139,255,.4) inset;
    }
    .format-card.active .dim { color: #bcd6ff; }

    /* ---- Ajout par lot ---- */
    .add-row { display: flex; gap: 10px; align-items: stretch; }
    .qty {
      display: flex; align-items: center; gap: 0;
      border: 1.5px solid var(--rail-line); border-radius: var(--radius-sm);
      background: rgba(255,255,255,.04); overflow: hidden; flex: none;
    }
    .qty button {
      width: 38px; border: none; background: transparent; color: var(--rail-ink);
      font-size: 18px; cursor: pointer; line-height: 1;
    }
    .qty button:hover { background: rgba(255,255,255,.08); }
    .qty input {
      width: 40px; border: none; background: transparent; color: var(--rail-ink);
      text-align: center; font-size: 15px; font-weight: 700; -moz-appearance: textfield;
    }
    .qty input::-webkit-outer-spin-button,
    .qty input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

    .btn {
      appearance: none; border: none; cursor: pointer;
      border-radius: var(--radius-sm); font-weight: 700; font-size: 14px;
      display: inline-flex; align-items: center; justify-content: center; gap: 9px;
      padding: 12px 16px; transition: background .15s, transform .05s, box-shadow .15s;
    }
    .btn:active { transform: translateY(1px); }
    .btn--add    { flex: 1; background: rgba(255,255,255,.08); color: var(--rail-ink); border: 1.5px solid var(--rail-line); }
    .btn--add:hover { background: rgba(255,255,255,.14); }
    .btn--ghost  { width: 100%; background: transparent; color: var(--rail-muted); border: 1.5px solid var(--rail-line); }
    .btn--ghost:hover { color: var(--rail-ink); background: rgba(255,255,255,.06); }

    /* ===================== Pied du rail (résumé + impression) ===================== */
    .rail__foot {
      border-top: 1px solid var(--rail-line);
      padding: 18px 24px 22px;
      background: rgba(0,0,0,.18);
    }
    .summary {
      display: flex; gap: 10px; margin-bottom: 14px;
    }
    .stat {
      flex: 1; background: rgba(255,255,255,.05);
      border: 1px solid var(--rail-line); border-radius: var(--radius-sm);
      padding: 10px 12px;
    }
    .stat .num { font-size: 22px; font-weight: 800; line-height: 1; }
    .stat .cap { font-size: 11px; color: var(--rail-muted); margin-top: 4px; }
    .warn {
      display: none; align-items: center; gap: 8px;
      font-size: 12px; color: #ffd7a6; margin-bottom: 12px;
    }
    .warn.show { display: flex; }
    .warn .dot { width: 8px; height: 8px; border-radius: 50%; background: #f5a524; flex: none; }

    .btn--print {
      width: 100%; padding: 15px; font-size: 15px;
      background: linear-gradient(180deg, #0a6cff 0%, var(--cf-blue) 100%);
      color: #fff; box-shadow: 0 8px 20px rgba(0,78,159,.35);
    }
    .btn--print:hover { box-shadow: 0 10px 26px rgba(0,78,159,.45); }

    /* ===================== Zone de travail ===================== */
    .stage {
      margin-right: var(--rail-w);
      min-height: 100vh;
      padding: 40px 36px 80px;
      display: flex; flex-direction: column; align-items: center;
      background:
        radial-gradient(60% 50% at 50% -10%, rgba(0,78,159,.06), transparent 70%),
        var(--bg-app);
    }
    .stage__head {
      width: 100%; max-width: 1160px;
      display: flex; align-items: baseline; justify-content: space-between;
      margin-bottom: 26px;
    }
    .stage__head h2 { margin: 0; font-size: 17px; font-weight: 700; }
    .stage__head .preview-note {
      font-size: 12px; color: var(--muted);
      background: #fff; border: 1px solid var(--line); border-radius: 999px;
      padding: 5px 12px;
    }

    #bonsList {
      display: flex; flex-wrap: wrap; justify-content: center;
      gap: 28px; max-width: 1160px; width: 100%;
    }

    /* Bon agrandi à l'écran pour la lisibilité (impression à taille réelle).
       zoom met à l'échelle le bon ET réserve la place dans la grille,
       contrairement à transform. Réinitialisé en @media print. */
    .bon-container { zoom: 1.7; margin: 0 auto; }
    .bon-wrap { position: relative; }

    /* ===================== Le bon (visuel inchangé sur le fond) ===================== */
    .bon-container {
      background: var(--paper);
      padding: 10px 12px 12px;
      box-shadow: var(--shadow-lg);
      position: relative;
      border-radius: 4px;
      border: 4px solid var(--cf-red);
      display: grid; column-gap: 12px;
      transition: box-shadow .15s, outline-color .15s;
      outline: 2px solid transparent; outline-offset: 4px;
    }
    .bon-wrap.incomplete .bon-container { outline-color: #f5a524; }

    .bon-container.layout-vertical {
      width: 5cm; min-height: 10cm;
      grid-template-columns: 1fr;
      grid-template-rows: auto auto auto auto auto 1fr;
      grid-template-areas: "header" "banner" "dates" "montant" "barcode" "legal";
    }
    .bon-container.layout-horizontal {
      width: 12.35cm; min-height: 5cm;
      grid-template-columns: 1.15fr 1fr;
      grid-template-rows: auto auto auto 1fr;
      grid-template-areas:
        "banner  banner" "header  montant" "dates   barcode" "legal   barcode";
    }
    .ga-header{grid-area:header}.ga-banner{grid-area:banner}.ga-dates{grid-area:dates}
    .ga-montant{grid-area:montant}.ga-barcode{grid-area:barcode}.ga-legal{grid-area:legal}

    .header { text-align: center; }
    .logo-img { height: 40px; width: auto; display: block; margin: 0 auto; }
    .layout-horizontal .logo-img { height: 34px; }
    .store-name { margin-top: 3px; font-size: 10px; font-weight: 700; color: var(--cf-blue); text-transform: uppercase; letter-spacing: .3px; }
    .store-address { font-size: 8.5px; color: var(--muted); }
    .layout-horizontal .store-name { white-space: nowrap; }

    .banner { margin: 6px -12px; padding: 5px 0; background: var(--cf-blue); color: #fff; text-align: center; font-weight: 800; font-size: 12px; letter-spacing: 1px; }
    .layout-horizontal .banner { margin-top: -10px; }

    .row { font-size: 9.5px; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; justify-content: center; }
    .label { font-weight: 700; color: var(--muted); text-transform: uppercase; font-size: 8.5px; letter-spacing: .4px; }
    .date-group { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }

    .layout-vertical .ga-dates, .layout-vertical .ga-montant, .layout-vertical .ga-barcode { border-top: 1px dashed var(--line); padding-top: 6px; margin-top: 6px; }
    .layout-horizontal .ga-montant, .layout-horizontal .ga-barcode { border-left: 1px dashed var(--line); padding-left: 12px; }
    .layout-horizontal .ga-barcode { border-top: 1px dashed var(--line); padding-top: 6px; margin-top: 6px; }
    .layout-horizontal .ga-dates, .layout-horizontal .ga-legal { border-top: 1px dashed var(--line); padding-top: 6px; margin-top: 6px; }

    input.field { border: none; border-bottom: 1px dotted transparent; outline: none; background: transparent; font-family: inherit; color: var(--ink); text-align: center; transition: border-color .15s, background .15s; border-radius: 2px; }
    input.field:hover { border-bottom-color: var(--line); }
    input.field:focus { border-bottom-color: var(--cf-blue); background: var(--cf-blue-50); }
    input.field::placeholder { color: #b6bcc6; }
    input.date-input { width: 78px; font-size: 9.5px; }

    .montant-block { text-align: center; }
    .montant-block .label { display: block; }
    input.montant-input { font-size: 26px; font-weight: 800; color: var(--cf-red); width: 100%; text-align: center; }

    .barcode-container { text-align: center; width: 100%; overflow: hidden; }
    .barcode-svg-container { min-height: 42px; }
    .barcode-svg-container svg { max-width: 100%; height: auto; display: block; margin: 0 auto; }
    input.ean-input { width: 100%; font-family: "Courier New", monospace; font-size: 12px; font-weight: 700; letter-spacing: 2px; margin-top: 3px; }
    .barcode-error { font-size: 8.5px; color: var(--cf-red); min-height: 14px; }

    .legal-text { font-size: 7.5px; text-align: center; line-height: 1.3; color: var(--muted); margin-top: auto; padding-top: 6px; }

    /* ---- Actions au survol d'un bon (supprimer / dupliquer) ---- */
    .bon-actions {
      position: absolute; top: -12px; right: -12px;
      display: flex; gap: 6px; opacity: 0; transform: translateY(-3px);
      transition: opacity .12s, transform .12s; z-index: 3;
    }
    .bon-wrap:hover .bon-actions { opacity: 1; transform: translateY(0); }
    .bon-actions button {
      width: 28px; height: 28px; border-radius: 50%; border: none; cursor: pointer;
      color: #fff; font-size: 14px; line-height: 1; box-shadow: var(--shadow-sm);
      display: grid; place-items: center;
    }
    .bon-dup { background: var(--cf-blue); }
    .bon-dup:hover { background: var(--cf-blue-dark); }
    .bon-remove { background: var(--cf-red); }
    .bon-remove:hover { background: #b80016; }

    /* badge n° de bon, repère discret */
    .bon-index {
      position: absolute; top: -10px; left: -10px;
      background: var(--ink); color: #fff; font-size: 11px; font-weight: 700;
      min-width: 22px; height: 22px; padding: 0 7px; border-radius: 999px;
      display: grid; place-items: center; box-shadow: var(--shadow-sm); z-index: 3;
    }

    /* ===================== Impression (logique conservée) ===================== */
    .print-page { display: contents; }
    .bon-slot { display: contents; }
    @media print {
      .rail { display: none !important; }
      .stage { margin: 0 !important; padding: 0 !important; background: #fff !important; }
      .stage__head { display: none !important; }
      .bon-container { zoom: 1 !important; width: auto !important; box-shadow: none; margin: 0; outline: none !important; }
      .bon-actions, .bon-index, .barcode-error { display: none !important; }
      .field::placeholder { color: transparent !important; }
      input.field:focus { background: transparent; border-bottom-color: transparent; }
      html, body { height: auto !important; min-height: 0 !important; background: #fff; }
      #bonsList { display: block; }
      .bon-wrap { position: static; }
      .print-page {
        display: grid; grid-template-columns: repeat(var(--print-cols, 3), 1fr);
        justify-items: center; align-items: start; gap: 3mm; padding-top: 8mm;
        break-after: page; page-break-after: always;
      }
      .print-page:last-child { break-after: auto; page-break-after: auto; }
      .bon-slot { display: flex; align-items: center; justify-content: center; padding: 2mm; box-sizing: border-box; border: 0.2mm dashed #9aa0a6; break-inside: avoid; page-break-inside: avoid; }
    }
  </style>
</head>
<body>

  <!-- ===================== SIDEBAR ===================== -->
  <aside class="rail">
    <div class="rail__brand">
      <span class="rail__logo"><img src="logo/logo.png" alt="Carrefour"></span>
      <div>
        <h1>Réimpression de bon</h1>
        <p>Carrefour Vannes</p>
      </div>
    </div>

    <div class="rail__body">
      <div class="group">
        <p class="group__label">Format du bon</p>
        <div class="format-grid" role="group" aria-label="Format">
          <button type="button" class="format-card" data-fmt="vertical">
            <span class="glyph"></span>
            <span class="name">Vertical</span>
          </button>
          <button type="button" class="format-card active" data-fmt="horizontal">
            <span class="glyph"></span>
            <span class="name">Horizontal</span>
          </button>
        </div>
      </div>

      <div class="group">
        <p class="group__label">Ajouter des bons</p>
        <div class="add-row">
          <div class="qty">
            <button type="button" id="qtyMinus" aria-label="Moins">−</button>
            <input type="number" id="qty" value="1" min="1" max="50" aria-label="Quantité">
            <button type="button" id="qtyPlus" aria-label="Plus">+</button>
          </div>
          <button type="button" class="btn btn--add" id="addButton">➕ Ajouter</button>
        </div>
      </div>

      <div class="group">
        <p class="group__label">Outils</p>
        <button type="button" class="btn btn--ghost" id="resetButton">↺ Tout réinitialiser</button>
      </div>
    </div>

    <div class="rail__foot">
      <div class="summary">
        <div class="stat"><div class="num" id="statBons">0</div><div class="cap">bons</div></div>
        <div class="stat"><div class="num" id="statPages">0</div><div class="cap">page(s) A4</div></div>
      </div>
      <div class="warn" id="warn"><span class="dot"></span><span id="warnText"></span></div>
      <button type="button" class="btn btn--print" id="printButton">🖨️ Imprimer</button>
    </div>
  </aside>

  <!-- ===================== ZONE DE TRAVAIL ===================== -->
  <main class="stage">
    <div class="stage__head">
      <h2>Plan de page</h2>
    </div>
    <div id="bonsList"></div>
  </main>

  <!-- ===================== TEMPLATE ===================== -->
  <template id="bonTemplate">
    <div class="bon-wrap">
      <span class="bon-index">1</span>
      <div class="bon-actions">
        <button type="button" class="bon-dup" title="Dupliquer ce bon" aria-label="Dupliquer">⧉</button>
        <button type="button" class="bon-remove" title="Supprimer ce bon" aria-label="Supprimer">×</button>
      </div>
      <div class="bon-container layout-horizontal">
        <div class="ga-header header">
          <img class="logo-img" src="logo/logo+nom-transparent.png" alt="">
          <div class="store-name">Hypermarché Carrefour Vannes</div>
          <div class="store-address">101 avenue de la Marne, 56000 Vannes</div>
        </div>
        <div class="ga-banner banner">BON D'ACHAT</div>
        <div class="ga-dates row">
          <span class="date-group"><span class="label">Valable du</span> <input type="date" class="field date-input date-debut"></span>
          <span class="date-group"><span class="label">au</span> <input type="date" class="field date-input date-fin"></span>
        </div>
        <div class="ga-montant montant-block">
          <span class="label">Montant du bon</span>
          <input type="text" class="field montant-input" placeholder="0,00 €" inputmode="decimal">
        </div>
        <div class="ga-barcode barcode-container">
          <div class="barcode-svg-container"></div>
          <input type="text" class="field ean-input" placeholder="Saisir l'EAN ici" inputmode="numeric">
          <div class="barcode-error"></div>
        </div>
        <div class="ga-legal legal-text">
          ⚠️ Bon non échangeable et non remboursable.<br>
          Visuel non officiel. Pour plus de renseignements,
          merci de vous approcher de l'accueil du magasin émetteur.
        </div>
      </div>
    </div>
  </template>

  <script>
    const bonsList = document.getElementById('bonsList');
    const template = document.getElementById('bonTemplate');
    const pageStyle = document.getElementById('pageStyle');
    const qtyInput = document.getElementById('qty');

    let currentLayout = 'horizontal';
    const COLS = { vertical: 3, horizontal: 1 };
    const PER_PAGE = { vertical: 6, horizontal: 4 };
    const PAGE_MARGIN_MM = 10;

    const toISO = d => d.toISOString().split('T')[0];
    function defaultDates() {
      const today = new Date(), fin = new Date();
      fin.setDate(fin.getDate() + 30);
      return [toISO(today), toISO(fin)];
    }

    function pickFormat(v) {
      if (/^\d{13}$/.test(v)) return "EAN13";
      if (/^\d{8}$/.test(v)) return "EAN8";
      return "CODE128";
    }
    function updateBarcode(card) {
      const ean = card.querySelector('.ean-input').value.trim();
      const container = card.querySelector('.barcode-svg-container');
      const errEl = card.querySelector('.barcode-error');
      container.innerHTML = ''; errEl.textContent = '';
      if (!ean) return;
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      container.appendChild(svg);
      const format = pickFormat(ean);
      try {
        JsBarcode(svg, ean, { format, lineColor: "#000", width: 1.6, height: 42, displayValue: false, margin: 0,
          valid: v => { if (!v) throw new Error("invalid"); } });
      } catch (e) {
        container.innerHTML = '';
        const svg2 = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        container.appendChild(svg2);
        try {
          JsBarcode(svg2, ean, { format: "CODE128", lineColor: "#000", width: 1.6, height: 42, displayValue: false, margin: 0 });
          if (format !== "CODE128") errEl.textContent = "Clé EAN invalide — affiché en CODE128.";
        } catch (e2) { container.innerHTML = ''; errEl.textContent = "Code-barres impossible à générer."; }
      }
    }

    function wireBon(wrap) {
      const card = wrap.querySelector('.bon-container');
      const ean = card.querySelector('.ean-input');
      ean.addEventListener('input', function () {
        const cleaned = this.value.replace(/\D/g, '');
        if (cleaned !== this.value) this.value = cleaned;
        updateBarcode(card); refreshState();
      });
      const montant = card.querySelector('.montant-input');
      montant.addEventListener('blur', function () {
        const raw = this.value.replace(/[^\d,.]/g, '').replace('.', ',');
        if (!raw) { this.value = ''; refreshState(); return; }
        const num = parseFloat(raw.replace(',', '.'));
        this.value = isNaN(num) ? '' : num.toFixed(2).replace('.', ',') + ' €';
        refreshState();
      });
      montant.addEventListener('focus', function () { this.value = this.value.replace(/\s*€\s*$/, ''); });

      // Entrée = champ suivant ; sur le dernier champ, on crée un bon et on y saute
      card.querySelectorAll('.field').forEach((f, i, list) => {
        f.addEventListener('keydown', ev => {
          if (ev.key !== 'Enter') return;
          ev.preventDefault();
          if (i < list.length - 1) list[i + 1].focus();
          else { const c = addBons(1); c.querySelector('.ean-input').focus(); }
        });
      });

      wrap.querySelector('.bon-remove').addEventListener('click', () => removeBon(wrap));
      wrap.querySelector('.bon-dup').addEventListener('click', () => duplicateBon(wrap));

      const [s, e] = defaultDates();
      card.querySelector('.date-debut').value = s;
      card.querySelector('.date-fin').value = e;
      applyLayout(card);
      updateBarcode(card);
    }

    const allWraps = () => Array.from(bonsList.querySelectorAll('.bon-wrap'));

    function makeBon() {
      const wrap = template.content.firstElementChild.cloneNode(true);
      const slot = document.createElement('div');
      slot.className = 'bon-slot';
      slot.appendChild(wrap);
      bonsList.appendChild(slot);
      wireBon(wrap);
      return wrap;
    }
    // renvoie le dernier bon créé (pour l'autofocus)
    function addBons(n) {
      let last;
      for (let i = 0; i < n; i++) last = makeBon();
      refreshState();
      return last;
    }
    function duplicateBon(wrap) {
      const src = wrap.querySelector('.bon-container');
      const dst = addBons(1).querySelector('.bon-container');
      ['.date-debut', '.date-fin', '.montant-input', '.ean-input'].forEach(sel => {
        dst.querySelector(sel).value = src.querySelector(sel).value;
      });
      updateBarcode(dst); refreshState();
    }
    function removeBon(wrap) {
      if (allWraps().length <= 1) return;
      wrap.closest('.bon-slot').remove();
      refreshState();
    }

    function applyLayout(card) {
      const h = currentLayout === 'horizontal';
      card.classList.toggle('layout-horizontal', h);
      card.classList.toggle('layout-vertical', !h);
    }
    function setLayout(mode) {
      currentLayout = mode;
      document.querySelectorAll('.format-card').forEach(c =>
        c.classList.toggle('active', c.dataset.fmt === mode));
      bonsList.querySelectorAll('.bon-container').forEach(applyLayout);
      refreshState();
    }

    function rebuildPages() {
      const slots = Array.from(bonsList.querySelectorAll('.bon-slot'));
      const n = PER_PAGE[currentLayout];
      bonsList.innerHTML = '';
      for (let i = 0; i < slots.length; i += n) {
        const page = document.createElement('div');
        page.className = 'print-page';
        slots.slice(i, i + n).forEach(s => page.appendChild(s));
        bonsList.appendChild(page);
      }
      bonsList.style.setProperty('--print-cols', COLS[currentLayout]);
    }

    // numérotation + repérage des bons incomplets + compteurs
    function refreshState() {
      rebuildPages();
      const wraps = allWraps();
      const count = wraps.length;
      let incomplete = 0;
      wraps.forEach((w, i) => {
        w.querySelector('.bon-index').textContent = i + 1;
        const ean = w.querySelector('.ean-input').value.trim();
        const montant = w.querySelector('.montant-input').value.trim();
        const bad = !ean || !montant;
        w.classList.toggle('incomplete', bad);
        if (bad) incomplete++;
        w.querySelector('.bon-remove').style.display = count <= 1 ? 'none' : '';
      });
      document.getElementById('statBons').textContent = count;
      document.getElementById('statPages').textContent = Math.ceil(count / PER_PAGE[currentLayout]);
      const warn = document.getElementById('warn');
      if (incomplete) {
        warn.classList.add('show');
        document.getElementById('warnText').textContent =
          incomplete + (incomplete > 1 ? ' bons incomplets' : ' bon incomplet') + ' (EAN ou montant manquant)';
      } else warn.classList.remove('show');
      pageStyle.textContent = '@page { size: A4 portrait; margin: ' + PAGE_MARGIN_MM + 'mm; }';
    }

    // ---- Câblage des contrôles ----
    document.querySelectorAll('.format-card').forEach(c =>
      c.addEventListener('click', () => setLayout(c.dataset.fmt)));
    document.getElementById('qtyMinus').addEventListener('click', () =>
      qtyInput.value = Math.max(1, (+qtyInput.value || 1) - 1));
    document.getElementById('qtyPlus').addEventListener('click', () =>
      qtyInput.value = Math.min(50, (+qtyInput.value || 1) + 1));
    document.getElementById('addButton').addEventListener('click', () => {
      const last = addBons(Math.max(1, Math.min(50, +qtyInput.value || 1)));
      last.querySelector('.ean-input').focus();
    });
    document.getElementById('printButton').addEventListener('click', () => window.print());
    document.getElementById('resetButton').addEventListener('click', () => {
      bonsList.innerHTML = ''; addBons(1);
    });

    // Init
    addBons(1);
    setLayout('horizontal');
  </script>
</body>
</html>
