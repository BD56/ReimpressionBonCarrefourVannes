<!DOCTYPE html>
<html lang="fr">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Réimpression Bon - Carrefour Vannes</title>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <!-- Taille de page d'impression, pilotée par JS selon le format choisi -->
  <style id="pageStyle">@page { size: 5cm 10cm; margin: 0; }</style>
  <style>
    :root {
      --cf-blue: #004E9F;
      --cf-blue-dark: #003a78;
      --cf-red: #E2001A;
      --ink: #1a1a1a;
      --muted: #6b7280;
      --line: #c7ccd4;
      --paper: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 32px 16px;
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      background: linear-gradient(160deg, #eef2f7 0%, #dde6f0 100%);
      min-height: 100vh;
      color: var(--ink);
    }

    .app-title { text-align: center; }
    .app-title h1 { margin: 0; font-size: 18px; color: var(--cf-blue); }
    .app-title p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }

    /* ---------- Logo Carrefour ---------- */
    .logo-img { height: 40px; width: auto; display: block; margin: 0 auto; }
    .layout-horizontal .logo-img { height: 38px; }
    .layout-vertical .logo-mark-only { display: none; }
    .layout-horizontal .logo-full { display: none; }

    /* ---------- Le bon (grille partagée entre les 2 formats) ---------- */
    .bon-container {
      background: var(--paper);
      padding: 10px 12px 12px;
      box-shadow: 0 10px 30px rgba(0, 30, 80, 0.18);
      position: relative;
      border-radius: 2px;
      border: 4px solid var(--cf-red);
      display: grid;
      column-gap: 12px;
    }

    /* Format vertical : 5 x 10 cm */
    .bon-container.layout-vertical {
      width: 5cm;
      min-height: 10cm;
      grid-template-columns: 1fr;
      grid-template-rows: auto auto auto auto auto 1fr;
      grid-template-areas:
        "header"
        "banner"
        "dates"
        "montant"
        "barcode"
        "legal";
    }

    /* Format horizontal : 12,35 x 5 cm */
    .bon-container.layout-horizontal {
      width: 12.35cm;
      min-height: 5cm;
      grid-template-columns: 1.15fr 1fr;
      grid-template-rows: auto auto auto 1fr;
      grid-template-areas:
        "banner  banner"
        "header  montant"
        "dates   barcode"
        "legal   barcode";
    }

    .ga-header  { grid-area: header; }
    .ga-banner  { grid-area: banner; }
    .ga-dates   { grid-area: dates; }
    .ga-montant { grid-area: montant; }
    .ga-barcode { grid-area: barcode; }
    .ga-legal   { grid-area: legal; }


    /* ---------- En-tête ---------- */
    .header { text-align: center; }
    .store-name {
      margin-top: 3px;
      font-size: 10px; font-weight: 700;
      color: var(--cf-blue);
      text-transform: uppercase; letter-spacing: 0.3px;
    }
    .store-address { font-size: 8.5px; color: var(--muted); }
    .layout-horizontal .store-name { white-space: nowrap; }

    /* ---------- Bandeau ---------- */
    .banner {
      margin: 6px -12px;
      padding: 5px 0;
      background: var(--cf-blue);
      color: #fff;
      text-align: center;
      font-weight: 800; font-size: 12px; letter-spacing: 1px;
    }
    .layout-horizontal .banner { margin-top: -10px; }

    /* ---------- Lignes / séparateurs ---------- */
    .row {
      font-size: 9.5px; color: var(--ink);
      display: flex; align-items: center; gap: 4px;
      flex-wrap: wrap; justify-content: center;
    }
    .label {
      font-weight: 700; color: var(--muted);
      text-transform: uppercase; font-size: 8.5px; letter-spacing: 0.4px;
    }
    /* « Valable du … » et « au … » restent solidaires et passent à la ligne ensemble */
    .date-group {
      display: inline-flex; align-items: center; gap: 4px;
      white-space: nowrap;
    }

    /* Séparateurs en pointillés selon le format */
    .layout-vertical .ga-dates,
    .layout-vertical .ga-montant,
    .layout-vertical .ga-barcode {
      border-top: 1px dashed var(--line);
      padding-top: 6px; margin-top: 6px;
    }
    .layout-horizontal .ga-montant,
    .layout-horizontal .ga-barcode {
      border-left: 1px dashed var(--line);
      padding-left: 12px;
    }
    .layout-horizontal .ga-barcode {
      border-top: 1px dashed var(--line);
      padding-top: 6px; margin-top: 6px;
    }
    .layout-horizontal .ga-dates,
    .layout-horizontal .ga-legal {
      border-top: 1px dashed var(--line);
      padding-top: 6px; margin-top: 6px;
    }

    /* Champs éditables : discrets, soulignés au focus */
    input.field {
      border: none;
      border-bottom: 1px dotted transparent;
      outline: none;
      background: transparent;
      font-family: inherit;
      color: var(--ink);
      text-align: center;
      transition: border-color .15s, background .15s;
      border-radius: 2px;
    }
    input.field:hover { border-bottom-color: var(--line); }
    input.field:focus { border-bottom-color: var(--cf-blue); background: #eef4fc; }
    input.field::placeholder { color: #b6bcc6; }
    input.date-input { width: 78px; font-size: 9.5px; }

    /* ---------- Montant ---------- */
    .montant-block { text-align: center; }
    .montant-block .label { display: block; }
    input.montant-input {
      font-size: 26px; font-weight: 800; color: var(--cf-red);
      width: 100%; text-align: center;
    }

    /* ---------- Code-barres ---------- */
    .barcode-container { text-align: center; width: 100%; overflow: hidden; }
    .barcode-svg-container { min-height: 42px; }
    .barcode-svg-container svg { max-width: 100%; height: auto; display: block; margin: 0 auto; }
    input.ean-input {
      width: 100%;
      font-family: "Courier New", monospace;
      font-size: 12px; font-weight: 700; letter-spacing: 2px;
      margin-top: 3px;
    }
    .barcode-error { font-size: 8.5px; color: var(--cf-red); min-height: 14px; }

    /* ---------- Mentions légales ---------- */
    .legal-text {
      font-size: 7.5px; text-align: center; line-height: 1.3;
      color: var(--muted); margin-top: auto; padding-top: 6px;
    }

    /* ---------- Barre de contrôle ---------- */
    .controls { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .segmented {
      display: inline-flex; border: 1px solid var(--cf-blue);
      border-radius: 8px; overflow: hidden; background: #fff;
    }
    .segmented button {
      padding: 8px 16px; border: none; background: #fff;
      color: var(--cf-blue); font-weight: 700; font-size: 13px; cursor: pointer;
    }
    .segmented button.active { background: var(--cf-blue); color: #fff; }
    .toolbar { display: flex; gap: 10px; align-items: center; }
    .toolbar button {
      padding: 10px 22px; border: none; border-radius: 6px; cursor: pointer;
      font-size: 14px; font-weight: 700; transition: background .15s, transform .05s;
    }
    .toolbar button:active { transform: translateY(1px); }
    #printButton { background: var(--cf-blue); color: #fff; }
    #printButton:hover { background: var(--cf-blue-dark); }
    #resetButton { background: #fff; color: var(--cf-blue); border: 1px solid var(--cf-blue); }
    #resetButton:hover { background: #eef4fc; }
    .hint { font-size: 11px; color: var(--muted); text-align: center; }

    /* ---------- Liste de bons ---------- */
    #bonsList {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      justify-content: center;
      align-items: flex-start;
    }
    /* À l'écran, les regroupements « page » et les emplacements sont transparents
       (le bon reste l'élément flex) ; ils ne structurent la grille qu'à l'impression. */
    .print-page { display: contents; }
    .bon-slot { display: contents; }
    .bon-remove {
      position: absolute;
      top: -10px; right: -10px;
      width: 24px; height: 24px;
      border-radius: 50%;
      border: none;
      background: var(--cf-red);
      color: #fff;
      font-size: 15px; font-weight: 700; line-height: 1;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.25);
      z-index: 2;
    }
    .bon-remove:hover { background: #b80016; }
    #addButton {
      padding: 10px 22px;
      border: 1px dashed var(--cf-blue);
      border-radius: 6px;
      background: #fff;
      color: var(--cf-blue);
      font-size: 14px; font-weight: 700; cursor: pointer;
    }
    #addButton:hover { background: #eef4fc; }

    /* ---------- Impression ---------- */
    @media print {
      /* Évite une 2e page blanche (le min-height:100vh de l'écran déborderait) */
      html, body { height: auto !important; min-height: 0 !important; }
      body { background: #fff; padding: 0; margin: 0; gap: 0; align-items: stretch; }
      .app-title, .controls, .hint, .bon-remove, .barcode-error { display: none !important; }
      .field::placeholder { color: transparent !important; }   /* pas de placeholder imprimé */
      input.field:focus { background: transparent; border-bottom-color: transparent; }
      .bon-container { box-shadow: none; margin: 0; background: #fff !important; }

      /* Limite STRICTE par page : les bons sont regroupés en « pages » de N, et un
         saut de page est FORCÉ après chaque groupe (break-after: page). On obtient
         donc exactement N bons par page, quelles que soient les marges de l'imprimante.
         À l'intérieur, grille à --print-cols colonnes. */
      #bonsList { display: block; }
      .print-page {
        display: grid;
        grid-template-columns: repeat(var(--print-cols, 3), 1fr);
        justify-items: center;
        align-items: start;
        gap: 3mm;
        padding-top: 8mm;               /* espace en haut de chaque feuille */
        break-after: page;
        page-break-after: always;
      }
      .print-page:last-child { break-after: auto; page-break-after: auto; }
      .bon-slot {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2mm;                   /* petite marge de découpe autour du bon */
        box-sizing: border-box;
        border: 0.2mm dashed #9aa0a6;   /* repère de découpe */
        break-inside: avoid;
        page-break-inside: avoid;
      }
    }
  </style>
</head>

    <p>Choisissez un format, remplissez les champs, puis imprimez.</p>
  </div>

    // Vertical : 3 colonnes, 6/page. Horizontal : 1 colonne, 4/page. Taille réelle.
    const COLS     = { vertical: 3, horizontal: 1 };
    const PER_PAGE = { vertical: 6, horizontal: 4 };
    const PAGE_MARGIN_MM = 10; // marge de sécurité (anti-troncature)

    function toISO(d) { return d.toISOString().split('T')[0]; }

    function defaultDates() {
      const today = new Date();
      const fin = new Date();
      fin.setDate(fin.getDate() + 30);
      return [toISO(today), toISO(fin)];
    }

    // ---------- Code-barres (par bon) ----------
    function pickFormat(value) {
      if (/^\d{13}$/.test(value)) return "EAN13";
      if (/^\d{8}$/.test(value))  return "EAN8";
      return "CODE128";
    }

    function updateBarcode(card) {
      const ean = card.querySelector('.ean-input').value.trim();
      const container = card.querySelector('.barcode-svg-container');
      const errEl = card.querySelector('.barcode-error');
      container.innerHTML = '';
      errEl.textContent = '';
      if (!ean) return;

      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      container.appendChild(svg);

      const format = pickFormat(ean);
      try {
        JsBarcode(svg, ean, {
          format: format, lineColor: "#000000",
          width: 1.6, height: 42, displayValue: false, margin: 0,
          valid: function (valid) { if (!valid) throw new Error("invalid"); }
        });
      } catch (e) {
        // Repli en CODE128 si le format EAN est invalide (clé de contrôle, etc.)
        container.innerHTML = '';
        const svg2 = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        container.appendChild(svg2);
        try {
          JsBarcode(svg2, ean, {
            format: "CODE128", lineColor: "#000000",
            width: 1.6, height: 42, displayValue: false, margin: 0
          });
          if (format !== "CODE128") errEl.textContent = "Clé EAN invalide — affiché en CODE128.";
        } catch (e2) {
          container.innerHTML = '';
          errEl.textContent = "Code-barres impossible à générer.";
        }
      }
    }

    // ---------- Création / câblage d'un bon ----------
    function wireBon(card) {
      // EAN : chiffres uniquement
      const ean = card.querySelector('.ean-input');
      ean.addEventListener('input', function () {
        const cleaned = this.value.replace(/\D/g, '');
        if (cleaned !== this.value) this.value = cleaned;
        updateBarcode(card);
      });

      // Montant : formatage "XX,XX €" à la sortie du champ
      const montant = card.querySelector('.montant-input');
      montant.addEventListener('blur', function () {
        const raw = this.value.replace(/[^\d,.]/g, '').replace('.', ',');
        if (!raw) { this.value = ''; return; }
        const num = parseFloat(raw.replace(',', '.'));
        if (isNaN(num)) { this.value = ''; return; }
        this.value = num.toFixed(2).replace('.', ',') + ' €';
      });
      montant.addEventListener('focus', function () {
        this.value = this.value.replace(/\s*€\s*$/, '');
      });

      card.querySelector('.bon-remove').addEventListener('click', () => removeBon(card));

      const [s, e] = defaultDates();
      card.querySelector('.date-debut').value = s;
      card.querySelector('.date-fin').value = e;

      applyLayout(card);
      updateBarcode(card);
    }

    function allSlots() { return Array.from(bonsList.querySelectorAll('.bon-slot')); }

    function addBon() {
      const card = template.content.firstElementChild.cloneNode(true);
      const slot = document.createElement('div');
      slot.className = 'bon-slot';
      slot.appendChild(card);
      bonsList.appendChild(slot);   // posé en vrac ; rebuildPages() le regroupera
      wireBon(card);
      refresh();
      return card;
    }

    function removeBon(card) {
      if (allSlots().length <= 1) return; // on garde toujours au moins un bon
      card.closest('.bon-slot').remove();
      refresh();
    }

    // ---------- Format / mise en page (commun à tous les bons) ----------
    function applyLayout(card) {
      const horizontal = currentLayout === 'horizontal';
      card.classList.toggle('layout-horizontal', horizontal);
      card.classList.toggle('layout-vertical', !horizontal);
    }

    function setLayout(mode) {
      currentLayout = mode;
      const horizontal = mode === 'horizontal';
      btnHorizontal.classList.toggle('active', horizontal);
      btnVertical.classList.toggle('active', !horizontal);
      bonsList.querySelectorAll('.bon-container').forEach(applyLayout);
      refresh();
    }

    // Regroupe les bons en « pages » de N (PER_PAGE) → saut de page forcé entre
    // les groupes (CSS). Garantit exactement N bons par page à l'impression.
    function rebuildPages() {
      const slots = allSlots();
      const n = PER_PAGE[currentLayout];
      bonsList.innerHTML = '';
      for (let i = 0; i < slots.length; i += n) {
        const page = document.createElement('div');
        page.className = 'print-page';
        slots.slice(i, i + n).forEach(function (s) { page.appendChild(s); });
        bonsList.appendChild(page);
      }
      bonsList.style.setProperty('--print-cols', COLS[currentLayout]);
    }

    function updatePageSize() {
      // Toujours A4 portrait avec une marge de sécurité (anti-troncature).
      pageStyle.textContent = '@page { size: A4 portrait; margin: ' + PAGE_MARGIN_MM + 'mm; }';
    }

    // Reconstruit les pages, met à jour boutons supprimer, taille de page et info.
    function refresh() {
      rebuildPages();
      const count = allSlots().length;
      const single = count <= 1;
      bonsList.querySelectorAll('.bon-remove').forEach(function (b) {
        b.style.display = single ? 'none' : '';
      });
      updatePageSize();
    }

    btnVertical.addEventListener('click', () => setLayout('vertical'));
    btnHorizontal.addEventListener('click', () => setLayout('horizontal'));
    document.getElementById('addButton').addEventListener('click', addBon);
    document.getElementById('printButton').addEventListener('click', () => window.print());
    document.getElementById('resetButton').addEventListener('click', function () {
      bonsList.innerHTML = '';
      addBon();
    });

    // Init (le script est en fin de body : le DOM est déjà prêt)
    addBon();
    setLayout('vertical');
  </script>
</body>
</html>
